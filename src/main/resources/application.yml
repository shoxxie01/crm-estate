spring:
  application:
    name: delta-crm

  datasource:
    # Port 5434 — patrz compose.yaml. Nadpisywalne przez DELTA_DB_URL.
    url: ${DELTA_DB_URL:jdbc:postgresql://localhost:5434/delta_crm}
    username: ${DELTA_DB_USER:delta}
    password: ${DELTA_DB_PASSWORD:delta}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Schemat należy do Flyway. Hibernate ma go tylko sprawdzić przy starcie —
      # niezgodność encji z migracją ma wybuchnąć od razu, a nie na produkcji.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never

delta:
  jwt:
    # Bez DELTA_JWT_SECRET aplikacja się nie uruchomi — to celowe.
    secret: ${DELTA_JWT_SECRET}
    ttl: 12h
    issuer: delta-crm
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    org.springframework.security: INFO
